[project]
name = "rambleon"
version = "0.1.0"
description = "Rambleon Mac companion: archives World of Warcraft: Forever adventure sessions and turns them into journals."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
]

[project.scripts]
ramble = "rambleon.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rambleon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
